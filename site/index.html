<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주말 빈자리</title>
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주말 빈자리">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1d1f23; --sub: #6b6f76; --line: #e7e2da;
    --ok: #1f8a4c; --ok-bg: #e3f4ea; --low: #9a6400; --low-bg: #fdf0d2;
    --no: #9aa0a8; --no-bg: #f0eeea; --accent: #2d5bd7; --warn-bg: #fff4e5; --warn: #8a4b00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1f2227; --ink: #eceef1; --sub: #9aa0a8; --line: #2e3238;
      --ok: #5fd08f; --ok-bg: #173a27; --low: #f3c054; --low-bg: #3d3014;
      --no: #6c727a; --no-bg: #262a30; --accent: #8fb0ff; --warn-bg: #3a2a14; --warn: #f3c38a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
  .updated { color: var(--sub); font-size: 13px; text-align: right; }
  .updated button {
    border: 0; background: none; color: var(--accent); font: inherit; padding: 4px 0 0; cursor: pointer;
  }
  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px;
  }
  .controls label { color: var(--sub); font-size: 14px; }
  .steppers { display: flex; flex-direction: column; gap: 6px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper .lbl { width: 66px; color: var(--sub); font-size: 14px; }
  .stepper button {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer;
  }
  .stepper output { min-width: 44px; text-align: center; font-weight: 700; font-size: 16px; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sub); cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  .opens { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .opens h3 { margin: 0 0 6px; font-size: 14px; color: var(--sub); font-weight: 600; }
  .open-row { padding: 6px 0; }
  .open-row + .open-row { border-top: 1px solid var(--line); }
  .open-row .who { font-weight: 700; font-size: 15px; }
  .open-row .rule { color: var(--sub); font-size: 13px; }
  .open-row .next { font-size: 14px; margin-top: 2px; }
  .open-row .next b { color: var(--accent); }
  .open-row .next .rule { white-space: nowrap; }
  .museum { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 6px; margin-bottom: 14px; }
  .museum h2 { font-size: 17px; margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .museum h2 a { color: var(--accent); font-size: 13px; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }

  .day { padding: 12px 0; border-top: 1px solid var(--line); }
  .museum h2 + .day, .museum .notice + .day, .museum .note + .day { border-top: 0; }
  .note { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .day-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .day-date { font-weight: 700; font-size: 16px; }
  .day-date .sat { color: #2d6fd7; } .day-date .sun { color: #d6453d; }
  @media (prefers-color-scheme: dark) { .day-date .sat { color: #8fb0ff; } .day-date .sun { color: #ff8a80; } }
  .day-sum { font-size: 13px; color: var(--sub); }
  .day-sum.has { color: var(--ok); font-weight: 600; }
  .chips { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 5px; }
  .chip {
    display: block; text-decoration: none; border-radius: 11px; padding: 7px 4px 8px; text-align: center;
    background: var(--no-bg); color: var(--no); min-height: 54px; min-width: 0;
  }
  .chip .t { font-size: 12px; display: block; opacity: .9; font-variant-numeric: tabular-nums; }
  .chip .n { font-size: 18px; font-weight: 750; display: block; letter-spacing: -0.02em; }
  .chip .n small { font-size: 12px; font-weight: 500; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.low { background: var(--low-bg); color: var(--low); }
  .chip.no .n { font-size: 14px; font-weight: 600; padding-top: 3px; }
  .chip.no.some .n { font-size: 16px; }
  .muted { color: var(--sub); font-size: 14px; padding: 4px 0 10px; }
  .region { padding: 12px 0 6px; border-top: 1px solid var(--line); }
  .museum h2 + .region { border-top: 0; }
  .region h3 { margin: 0 0 6px; font-size: 15px; }
  .region h3 span { color: var(--sub); font-weight: 500; font-size: 13px; margin-left: 4px; }
  .places { list-style: none; margin: 0; padding: 0; }
  .places li { padding: 9px 0; font-size: 15px; }
  .places li + li { border-top: 1px dashed var(--line); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--sub); font-size: 12px; margin: 4px 2px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .hidden-note { color: var(--sub); font-size: 13px; padding: 2px 0 10px; }

  .tabs-bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg); margin: 0 -16px 12px; padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>주말 빈자리</h1>
    <div class="updated"><span id="updated">불러오는 중…</span><br><button id="reload" type="button">새로고침</button></div>
  </header>

  <div class="controls" id="controls">
    <div class="steppers">
      <div class="stepper" role="group" aria-label="가족 전체 인원">
        <label class="lbl">우리 가족</label>
        <button type="button" id="minus" aria-label="가족 인원 줄이기">−</button>
        <output id="people" aria-live="polite">4명</output>
        <button type="button" id="plus" aria-label="가족 인원 늘리기">+</button>
      </div>
      <div class="stepper" role="group" aria-label="아이 수" id="kidsRow" hidden>
        <label class="lbl">그중 아이</label>
        <button type="button" id="kminus" aria-label="아이 수 줄이기">−</button>
        <output id="kids" aria-live="polite">1명</output>
        <button type="button" id="kplus" aria-label="아이 수 늘리기">+</button>
      </div>
    </div>
    <label class="toggle"><input type="checkbox" id="onlyAvail"> 갈 수 있는 날만</label>
  </div>

  <nav class="tabs-bar" aria-label="박물관 선택"><div class="tabs" id="tabs" role="tablist"></div></nav>

  <section class="opens" id="opens" hidden><h3>예약 열리는 시간</h3><div id="opensList"></div></section>

  <main id="list" role="tabpanel"></main>

  <div class="legend" id="legend">
    <span><i style="background:var(--ok)"></i>여유</span>
    <span><i style="background:var(--low)"></i>얼마 안 남음</span>
    <span><i style="background:var(--no)"></i>마감·인원 부족</span>
    <span>회차를 누르면 예약 페이지로 이동해요</span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let people = store.get("people", 4);
let kids = store.get("kids", 1);
let onlyAvail = store.get("onlyAvail", false);
let data = null;
let tab = (location.hash || "").slice(1) || store.get("tab", null);

function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "방금 전";
  if (m < 60) return `${m}분 전`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}시간 전`;
  return `${Math.floor(h / 24)}일 전`;
}

// Seats a museum needs: children-only programs count kids, everything else the whole family.
const needFor = (m) => m.partyType === "kids" ? kids : people;
const needLabel = (m) => m.partyType === "kids" ? `아이 ${kids}명` : `${people}명`;

function chipClass(s, need = people) {
  if (s.status !== "open" || s.remaining < need) return "no";
  // "Few left" = 20% of a session's capacity (10 seats when capacity is unknown).
  return s.remaining <= (s.capacity ? Math.max(2, s.capacity * 0.2) : 10) ? "low" : "ok";
}

function chipLabel(s) {
  if (s.status === "ended") return "종료";
  if (s.status !== "open" || s.remaining === 0) return "마감";
  return `${s.remaining}<small>석</small>`;
}

function dateLabel(d) {
  const [, mo, da] = d.date.split("-").map(Number);
  const cls = d.holiday || d.weekday === "일" ? "sun" : d.weekday === "토" ? "sat" : "";
  const hol = d.holiday ? `·${typeof d.holiday === "string" ? esc(d.holiday) : "공휴일"}` : "";
  return `${mo}/${da} <span class="${cls}">${d.weekday}${hol}</span>`;
}

const WD = ["일", "월", "화", "수", "목", "금", "토"];
function kstParts(t) {
  // Wall-clock parts in Korea time, whatever the phone's timezone.
  const k = new Date(t.getTime() + 9 * 3600e3);
  return { y: k.getUTCFullYear(), m: k.getUTCMonth() + 1, d: k.getUTCDate(), w: k.getUTCDay(), h: k.getUTCHours(), mi: k.getUTCMinutes() };
}
function dayWord(p) {
  const n = kstParts(new Date());
  const diff = Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(n.y, n.m - 1, n.d)) / 864e5);
  return diff === 0 ? "오늘" : diff === 1 ? "내일" : diff === 2 ? "모레" : `${p.m}/${p.d}(${WD[p.w]})`;
}
function openWhen(iso) {
  const t = new Date(iso);
  const p = kstParts(t);
  if (p.h === 0 && p.mi === 0) {
    // 0시 is easier to read as "the night before, 12 o'clock".
    return `${dayWord(kstParts(new Date(t.getTime() - 60e3)))} 밤 12시`;
  }
  const ap = p.h < 12 ? "오전" : "오후";
  const h12 = p.h % 12 || 12;
  return `${dayWord(p)} ${ap} ${h12}시${p.mi ? ` ${p.mi}분` : ""}`;
}
function openLabel(d) {
  if (!d.opensAtDateOnly) return openWhen(d.opensAt);
  const p = kstParts(new Date(d.opensAt));
  return dayWord(p);
}
function untilText(iso) {
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return "열렸어요";
  const m = Math.round(ms / 60000);
  if (m < 60) return `${m}분 뒤`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h}시간 ${m % 60}분 뒤` : `${Math.floor(h / 24)}일 뒤`;
}
function shortDate(d) {
  const [, mo, da] = d.date.split("-").map(Number);
  return `${mo}/${da}(${d.weekday})`;
}
function renderOpens() {
  const rows = data.museums.filter(m => m.id === tab && m.openRule).map(m => {
    const next = m.days.find(d => d.status === "notOpen" && d.opensAt && new Date(d.opensAt) > Date.now());
    const nextHtml = next
      ? `<div class="next">${shortDate(next)}${next.holiday ? " 공휴일" : ""} 예약 → <b>${openLabel(next)}</b> 오픈 <span class="rule">(${untilText(next.opensAt)})</span></div>`
      : "";
    return `<div class="open-row"><div class="rule">${esc(m.openRule.text)}</div>${nextHtml}</div>`;
  });
  $("opens").hidden = !rows.length;
  $("opensList").innerHTML = rows.join("");
}

// Up to 5 sessions fit one row on a phone; more wrap into two even rows.
const cols = (n) => n <= 5 ? Math.max(n, 1) : Math.ceil(n / 2);

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// "기타" tab: places worth visiting, names only, grouped by region (no seat lookup).
const ETC_ID = "etc";
const ETC_PLACES = [
  ["서울", [
    "국립어린이과학관",
    "서대문자연사박물관",
    "서울공예박물관 어린이박물관",
    "서울상상나라",
    "서울시립과학관",
    "서울아리수나라",
    "서울역사박물관 어린이박물관",
    "전쟁기념관 어린이박물관",
  ]],
  ["인천", ["국립생물자원관", "인천어린이과학관"]],
  ["경기", ["고양어린이박물관"]],
];

function renderEtc() {
  const groups = ETC_PLACES.map(([region, names]) =>
    `<div class="region"><h3>${esc(region)}<span>${names.length}곳</span></h3>
      <ul class="places">${names.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("");
  return `<section class="museum"><h2>갈 만한 곳</h2>${groups}</section>`;
}

function render() {
  $("people").textContent = `${people}명`;
  $("kids").textContent = `${kids}명`;
  $("onlyAvail").checked = onlyAvail;
  if (!data) return;
  $("updated").textContent = `${ago(data.updatedAt)} 확인`;
  if (tab !== ETC_ID && !data.museums.some(m => m.id === tab)) tab = data.museums[0]?.id;
  renderTabs();
  renderOpens();
  const isEtc = tab === ETC_ID;
  $("controls").hidden = isEtc;
  $("legend").hidden = isEtc;
  if (isEtc) {
    $("list").setAttribute("aria-labelledby", `tab-${ETC_ID}`);
    $("list").innerHTML = renderEtc();
    return;
  }

  const cur = data.museums.find(m => m.id === tab);
  // The "그중 아이" stepper only matters for children-only programs.
  $("kidsRow").hidden = !(cur && cur.partyType === "kids");
  $("list").setAttribute("aria-labelledby", `tab-${tab}`);
  $("list").innerHTML = data.museums.filter(m => m.id === tab).map(m => {
    let hidden = 0;
    const need = needFor(m);
    const days = m.days.map(d => {
      if (d.status === "notOpen") {
        if (onlyAvail) { hidden++; return ""; }
        return `<div class="day"><div class="day-head"><span class="day-date">${dateLabel(d)}</span><span class="day-sum">${d.opensAt ? `${openLabel(d)} 예약 오픈` : "아직 예약이 열리지 않았어요"}</span></div></div>`;
      }
      const usable = d.sessions.filter(s => chipClass(s, need) !== "no").length;
      if (onlyAvail && !usable) { hidden++; return ""; }
      const sum = d.status === "closed" ? "휴관"
        : usable ? `${usable}개 회차 가능` : `${needLabel(m)} 자리 없음`;
      const chips = d.sessions.map(s =>
        `<a class="chip ${chipClass(s, need)}${s.status === "open" && s.remaining > 0 ? " some" : ""}" title="${s.no}회 ${esc(s.time)}" href="${esc(m.bookingUrl)}" target="_blank" rel="noopener">
           <span class="t">${esc(s.time.split("~")[0])}</span>
           <span class="n">${chipLabel(s)}</span></a>`).join("");
      return `<div class="day"><div class="day-head"><span class="day-date">${dateLabel(d)}</span><span class="day-sum ${usable ? "has" : ""}">${sum}</span></div><div class="chips" style="--n:${cols(d.sessions.length)}">${chips}</div></div>`;
    }).join("");

    const notice = m.ok ? "" :
      `<div class="notice">지금 이 박물관 정보를 가져오지 못했어요.${m.checkedAt ? ` 아래는 ${ago(m.checkedAt)} 정보예요.` : ""}</div>`;
    const empty = !days.trim()
      ? `<div class="muted">${hidden ? `${needLabel(m)}이 갈 수 있는 주말 회차가 없어요.` : "예약 가능한 주말이 없어요."}</div>` : "";
    return `<section class="museum"><h2>${esc(m.name)}<a href="${esc(m.bookingUrl)}" target="_blank" rel="noopener">예약하기 ›</a></h2>${m.note ? `<div class="note">${esc(m.note)}</div>` : ""}${notice}${days}${empty}</section>`;
  }).join("");
}

function renderTabs() {
  const el = $("tabs");
  el.innerHTML = [...data.museums, { id: ETC_ID, tab: "기타" }].map(m => {
    const sel = m.id === tab;
    return `<button type="button" role="tab" class="tab" id="tab-${esc(m.id)}" data-id="${esc(m.id)}"
      aria-selected="${sel}" aria-controls="list" tabindex="${sel ? 0 : -1}">${esc(m.tab || m.short || m.name)}</button>`;
  }).join("");
}

function selectTab(id, focus) {
  if (!id || id === tab) return;
  tab = id;
  store.set("tab", tab);
  try { history.replaceState(null, "", `#${id}`); } catch {}
  render();
  // Bring the newly selected museum to the top of the screen, just under the tab bar.
  const bar = document.querySelector(".tabs-bar");
  if (window.scrollY > bar.offsetTop) window.scrollTo({ top: bar.offsetTop });
  if (focus) document.getElementById(`tab-${id}`)?.focus();
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (b) selectTab(b.dataset.id);
});
$("tabs").addEventListener("keydown", (e) => {
  const ids = data ? [...data.museums.map(m => m.id), ETC_ID] : [];
  const i = ids.indexOf(tab);
  const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: ids.length - 1 }[e.key];
  if (next === undefined || !ids.length) return;
  e.preventDefault();
  selectTab(ids[(next + ids.length) % ids.length], true);
});
window.addEventListener("hashchange", () => selectTab(location.hash.slice(1)));

async function load() {
  $("updated").textContent = "불러오는 중…";
  try {
    const r = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    data = await r.json();
  } catch (e) {
    if (!data) $("list").innerHTML = `<div class="museum"><div class="muted">정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div></div>`;
  }
  render();
}

$("kminus").onclick = () => { kids = Math.max(1, kids - 1); store.set("kids", kids); render(); };
$("kplus").onclick = () => { kids = Math.min(people, kids + 1); store.set("kids", kids); render(); };
$("minus").onclick = () => { people = Math.max(1, people - 1); kids = Math.min(kids, people); store.set("people", people); store.set("kids", kids); render(); };
$("plus").onclick = () => { people = Math.min(10, people + 1); store.set("people", people); render(); };
$("onlyAvail").onchange = (e) => { onlyAvail = e.target.checked; store.set("onlyAvail", onlyAvail); render(); };
$("reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
setInterval(() => { if (data) { $("updated").textContent = `${ago(data.updatedAt)} 확인`; renderOpens(); } }, 30 * 1000);
load();
</script>
</body>
</html>
